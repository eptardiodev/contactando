name: contactando
description: CRM ligero para gestión de clientes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Routing
  go_router: ^14.2.7

  # DI
  get_it: ^8.0.2
  injectable: ^2.4.4

  # Backend
  supabase_flutter: ^2.5.6

  # Error handling
  fpdart: ^1.1.0

  # i18n
  intl: ^0.20.2

  # Storage
  shared_preferences: ^2.3.2

  #Logger
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.11
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # Lints
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
